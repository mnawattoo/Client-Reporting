<!--
  SETUP — do this in the GHL Form Builder before pasting this block:

  1. Add these NATIVE fields to the form (GHL's own field types), same as
     you would for any form: First Name, Last Name, Email, Phone (use this
     for "WhatsApp number"). Do not recreate them in HTML below — GHL only
     submits data it collects through its own native/recognized fields, so
     these must stay native for the contact record to populate correctly.

  2. For every other field below, add a HIDDEN field bound to a Custom
     Field in your GHL account (Form Builder > Add Field > Custom Field,
     set to Hidden). Create one for each of:
       property_location, development_name, unit_number, bedrooms,
       property_type, current_situation, current_nightly_rate,
       additional_notes, whatsapp_optin
     (and privacy_consent too, unless you're using GHL's own built-in
     consent/terms checkbox under Form Settings instead of the one below).

  3. Save the form, open it in Preview, right-click each hidden input and
     "Inspect" to find its generated `id` attribute (GHL assigns these
     automatically, e.g. something like "hidden_abc123"). Copy each id
     into FIELD_ID_MAP in the script below — this is what lets the visible
     dropdowns/text fields here hand their values off to GHL's own
     submission.

  4. Drag one "Custom HTML" field into the form (placed anywhere above the
     Submit button) and paste this entire file into it.

  CONFIRM WITH CLIENT (still open from the original spec):
   - "Current situation" is called a segment driver in the spec but its
     option list wasn't included — the options below are a placeholder
     guess; replace them since this field likely drives workflow branching.
   - The exact §3 consent / WhatsApp opt-in copy wasn't provided either —
     the wording below is placeholder legal text, not approved copy.
-->
<style>
  #pi-extra-fields * { box-sizing: border-box; }

  #pi-extra-fields {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2933;
  }

  #pi-extra-fields .pi-field {
    margin-bottom: 18px;
  }

  #pi-extra-fields .pi-row {
    display: flex;
    gap: 16px;
  }

  #pi-extra-fields .pi-row .pi-field {
    flex: 1 1 0;
    min-width: 0;
  }

  #pi-extra-fields .pi-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  #pi-extra-fields .pi-optional {
    font-weight: 400;
    color: #6b7280;
  }

  #pi-extra-fields .pi-required {
    color: #c0392b;
  }

  #pi-extra-fields input[type="text"],
  #pi-extra-fields select,
  #pi-extra-fields textarea {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border: 1px solid #d7dce1;
    border-radius: 8px;
    background: #fff;
    color: #1f2933;
    font-family: inherit;
  }

  #pi-extra-fields textarea {
    resize: vertical;
    min-height: 90px;
  }

  #pi-extra-fields input.pi-invalid,
  #pi-extra-fields select.pi-invalid {
    border-color: #c0392b;
  }

  #pi-extra-fields .pi-hint {
    margin-top: 5px;
    font-size: 12.5px;
    color: #6b7280;
  }

  #pi-extra-fields .pi-error-msg {
    margin-top: 5px;
    font-size: 12.5px;
    color: #c0392b;
    display: none;
  }

  #pi-extra-fields .pi-field.pi-has-error .pi-error-msg {
    display: block;
  }

  #pi-extra-fields .pi-checkbox-field {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }

  #pi-extra-fields .pi-checkbox-field input[type="checkbox"] {
    margin-top: 3px;
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
  }

  #pi-extra-fields .pi-checkbox-field label {
    font-size: 13.5px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {
    #pi-extra-fields .pi-row { flex-direction: column; gap: 0; }
  }
</style>

<div id="pi-extra-fields">

  <div class="pi-field">
    <label for="pi-property-location">Property location <span class="pi-required">*</span></label>
    <select id="pi-property-location" data-required="true">
      <option value="" disabled selected>Select a location</option>

      <optgroup label="CAP CANA (Cap Cana, Juanillo, Punta Espada)">
        <option value="Cap Cana - general">Cap Cana — general</option>
        <option value="Las Iguanas">Las Iguanas</option>
        <option value="Marina Cap Cana">Marina Cap Cana</option>
        <option value="Juanillo">Juanillo</option>
        <option value="Punta Espada">Punta Espada</option>
      </optgroup>

      <optgroup label="PUNTA CANA (Puntacana Resort, Village, Downtown)">
        <option value="Punta Cana Village">Punta Cana Village</option>
        <option value="Puntacana Resort & Club">Puntacana Resort &amp; Club</option>
        <option value="Tortuga Bay">Tortuga Bay</option>
        <option value="Downtown Punta Cana">Downtown Punta Cana</option>
      </optgroup>

      <optgroup label="BÁVARO (Cocotal, Cana Bay, Vista Cana, Los Corales, Cortecito)">
        <option value="Bavaro - general">Bávaro — general</option>
        <option value="Cocotal Golf & Country Club">Cocotal Golf &amp; Country Club</option>
        <option value="Cana Bay">Cana Bay</option>
        <option value="Vista Cana">Vista Cana</option>
        <option value="White Sands">White Sands</option>
        <option value="Pueblo Bavaro">Pueblo Bávaro</option>
        <option value="Brisas de Bavaro">Brisas de Bávaro</option>
        <option value="Los Corales">Los Corales</option>
        <option value="El Cortecito">El Cortecito</option>
        <option value="Arena Gorda">Arena Gorda</option>
      </optgroup>

      <optgroup label="NORTH COAST [COSTA NORTE] (Uvero Alto, Macao)">
        <option value="Uvero Alto">Uvero Alto</option>
        <option value="Macao">Macao</option>
      </optgroup>

      <optgroup label="OTHER [OTRA ZONA]">
        <option value="Veron">Verón</option>
        <option value="Other Punta Cana area">Other Punta Cana area</option>
        <option value="Elsewhere in the Dominican Republic">Elsewhere in the Dominican Republic</option>
      </optgroup>
    </select>
    <div class="pi-error-msg">Please select your property's location.</div>
  </div>

  <div class="pi-field">
    <label for="pi-development">Development / building name <span class="pi-required">*</span></label>
    <input type="text" id="pi-development" placeholder="e.g. Vermare, Las Iguanas, Cocotal Palmas" data-required="true">
    <div class="pi-error-msg">Please enter the development or building name.</div>
  </div>

  <div class="pi-field">
    <label for="pi-unit">Unit or villa number <span class="pi-optional">(optional)</span></label>
    <input type="text" id="pi-unit">
  </div>

  <div class="pi-row">
    <div class="pi-field">
      <label for="pi-bedrooms">Bedrooms <span class="pi-required">*</span></label>
      <select id="pi-bedrooms" data-required="true">
        <option value="" disabled selected>Select</option>
        <option value="Studio">Studio</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6+">6+</option>
      </select>
      <div class="pi-error-msg">Please select the number of bedrooms.</div>
    </div>

    <div class="pi-field">
      <label for="pi-property-type">Property type <span class="pi-required">*</span></label>
      <select id="pi-property-type" data-required="true">
        <option value="" disabled selected>Select</option>
        <option value="Apartment/Condo">Apartment / Condo</option>
        <option value="Villa">Villa</option>
        <option value="Townhouse">Townhouse</option>
        <option value="Other">Other</option>
      </select>
      <div class="pi-error-msg">Please select a property type.</div>
    </div>
  </div>

  <div class="pi-field">
    <label for="pi-current-situation">Current situation <span class="pi-required">*</span></label>
    <select id="pi-current-situation" data-required="true">
      <option value="" disabled selected>Select</option>
      <option value="Not currently renting">Not currently renting out my property</option>
      <option value="Self-managing">Currently self-managing short-term rentals</option>
      <option value="With another manager">Currently using another property management company</option>
      <option value="New owner">Just purchased / about to close on a property</option>
      <option value="Considering purchase">Still considering purchasing a property</option>
    </select>
    <div class="pi-error-msg">Please select your current situation.</div>
  </div>

  <div class="pi-field">
    <label for="pi-nightly-rate">Current nightly rate <span class="pi-optional">(optional, USD)</span></label>
    <input type="text" id="pi-nightly-rate" placeholder="e.g. 150">
  </div>

  <div class="pi-field">
    <label for="pi-notes">Anything else we should know? <span class="pi-optional">(optional)</span></label>
    <textarea id="pi-notes"></textarea>
  </div>

  <div class="pi-checkbox-field">
    <input type="checkbox" id="pi-consent">
    <label for="pi-consent">
      I agree to the <a href="#" target="_blank" rel="noopener">Privacy Policy</a> and consent to be contacted about my inquiry by email, phone, or WhatsApp. <span class="pi-required">*</span>
    </label>
  </div>
  <div class="pi-field">
    <div class="pi-error-msg" id="pi-consent-error">Please accept the privacy and contact consent to continue.</div>
  </div>

  <div class="pi-checkbox-field">
    <input type="checkbox" id="pi-whatsapp-optin">
    <label for="pi-whatsapp-optin">
      I'd also like to receive updates and offers via WhatsApp.
    </label>
  </div>

</div>

<script>
(function () {
  // Fill these in with the hidden Custom Field input `id`s from step 3
  // above. Anything left blank is skipped (its value never reaches GHL).
  var FIELD_ID_MAP = {
    property_location: "",
    development_name: "",
    unit_number: "",
    bedrooms: "",
    property_type: "",
    current_situation: "",
    current_nightly_rate: "",
    additional_notes: "",
    privacy_consent: "",
    whatsapp_optin: ""
  };

  var wrapper = document.getElementById("pi-extra-fields");
  var form = wrapper.closest("form");
  var consentField = document.getElementById("pi-consent");
  var consentErrorWrapper = document.getElementById("pi-consent-error").closest(".pi-field");

  var visibleFields = {
    property_location: document.getElementById("pi-property-location"),
    development_name: document.getElementById("pi-development"),
    unit_number: document.getElementById("pi-unit"),
    bedrooms: document.getElementById("pi-bedrooms"),
    property_type: document.getElementById("pi-property-type"),
    current_situation: document.getElementById("pi-current-situation"),
    current_nightly_rate: document.getElementById("pi-nightly-rate"),
    additional_notes: document.getElementById("pi-notes")
  };

  function setFieldError(field, hasError) {
    var fieldWrapper = field.closest(".pi-field");
    if (!fieldWrapper) return;
    fieldWrapper.classList.toggle("pi-has-error", hasError);
    field.classList.toggle("pi-invalid", hasError);
  }

  function validate() {
    var valid = true;

    wrapper.querySelectorAll("[data-required='true']").forEach(function (field) {
      var fieldValid = field.value.trim() !== "";
      setFieldError(field, !fieldValid);
      if (!fieldValid) valid = false;
    });

    var consentValid = consentField.checked;
    consentErrorWrapper.classList.toggle("pi-has-error", !consentValid);
    if (!consentValid) valid = false;

    return valid;
  }

  function pushToHiddenField(id, value) {
    if (!id) return;
    var hiddenInput = document.getElementById(id);
    if (!hiddenInput) return;
    hiddenInput.value = value;
    hiddenInput.dispatchEvent(new Event("input", { bubbles: true }));
    hiddenInput.dispatchEvent(new Event("change", { bubbles: true }));
  }

  function syncHiddenFields() {
    Object.keys(visibleFields).forEach(function (key) {
      pushToHiddenField(FIELD_ID_MAP[key], visibleFields[key].value.trim());
    });
    pushToHiddenField(FIELD_ID_MAP.privacy_consent, consentField.checked ? "yes" : "no");
    pushToHiddenField(FIELD_ID_MAP.whatsapp_optin, document.getElementById("pi-whatsapp-optin").checked ? "yes" : "no");
  }

  if (form) {
    // Capture-phase listener on document runs before GHL's own submit
    // handler on the form, so an invalid state can block it outright.
    document.addEventListener("submit", function (e) {
      if (e.target !== form) return;
      if (!validate()) {
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }
      syncHiddenFields();
    }, true);
  }

  wrapper.addEventListener("change", syncHiddenFields);
  wrapper.addEventListener("input", syncHiddenFields);
  consentField.addEventListener("change", syncHiddenFields);
  document.getElementById("pi-whatsapp-optin").addEventListener("change", syncHiddenFields);
})();
</script>
